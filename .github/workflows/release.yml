name: Versioned Windows release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versioned-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install plotting dependencies
        run: python -m pip install -r requirements-plot.txt

      - name: Validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "VERSION must be MAJOR.MINOR.PATCH; got '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Ensure the version tag is unused
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing tags" }
          $existing = @(git tag --list $env:RELEASE_TAG)
          if ($existing.Count -gt 0) {
            $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $env:RELEASE_TAG already points to another commit"
            }
          }

      - name: Configure Release build
        run: cmake -S . -B build -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $exe = "build/Release/nnci.exe"
          if (-not (Test-Path $exe)) { throw "Release executable not found: $exe" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Executable help smoke test failed" }

      - name: Package and smoke-test Windows distribution
        shell: pwsh
        run: |
          $packageRoot = "dist/nnci-windows-x64"
          New-Item -ItemType Directory -Force "$packageRoot/scripts" | Out-Null
          Copy-Item "build/Release/nnci.exe" "$packageRoot/nnci.exe"
          Copy-Item "build/Release/scripts/plot_capacity.py" "$packageRoot/scripts/plot_capacity.py"
          Copy-Item "build/Release/scripts/plot_strength.py" "$packageRoot/scripts/plot_strength.py"
          Copy-Item "requirements-plot.txt" "$packageRoot/requirements-plot.txt"
          @'
          NNCI Windows x64

          Extract the entire package and keep the scripts folder beside nnci.exe.
          Run nnci.exe from any working directory. Plotting requires Python 3 and
          matplotlib. Install the plotting dependency with:

              python -m pip install -r requirements-plot.txt

          Example:
              .\nnci.exe perceptron --strength --dimensions 20 --patterns 15 --datasets 50 --max-epochs 100
          '@ | Set-Content "$packageRoot/README.txt"
          Compress-Archive -Path "$packageRoot/*" -DestinationPath "dist/nnci-windows-x64.zip" -Force

          $check = Join-Path $env:RUNNER_TEMP "nnci-package-check"
          Expand-Archive "dist/nnci-windows-x64.zip" $check -Force
          if (-not (Test-Path "$check/nnci.exe") -or
              -not (Test-Path "$check/scripts/plot_strength.py") -or
              -not (Test-Path "$check/scripts/plot_capacity.py")) {
            throw "Windows package is missing the executable or plotting scripts"
          }
          $smoke = Join-Path $env:RUNNER_TEMP "nnci-package-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Push-Location $smoke
          & "$check/nnci.exe" perceptron --strength --dimensions 2 --patterns 2 --datasets 10 --max-epochs 100 --seed 4
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "results/strength_histogram.png")) {
            throw "Extracted package could not plot from an unrelated working directory"
          }
          Pop-Location

      - name: Tag commit and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $existing = @(git tag --list $env:RELEASE_TAG)
          if ($existing.Count -eq 0) {
            git tag -a $env:RELEASE_TAG $env:GITHUB_SHA -m "Release $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not create release tag" }
          }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not push release tag" }

          gh release create $env:RELEASE_TAG "dist/nnci-windows-x64.zip" `
            --verify-tag --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub release" }

          $releaseJson = gh release view $env:RELEASE_TAG --json tagName,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not verify published release" }
          $release = $releaseJson | ConvertFrom-Json
          $assets = @($release.assets)
          if ($release.tagName -ne $env:RELEASE_TAG -or
              $assets.Count -ne 1 -or $assets[0].name -ne "nnci-windows-x64.zip") {
            throw "Expected release $env:RELEASE_TAG to contain only nnci-windows-x64.zip"
          }
