name: Versioned Windows release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versioned-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install plotting dependencies
        run: python -m pip install -r requirements-plot.txt

      - name: Validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "VERSION must be MAJOR.MINOR.PATCH; got '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Ensure the version tag is unused
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing tags" }
          $existing = @(git tag --list $env:RELEASE_TAG)
          if ($existing.Count -gt 0) {
            $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $env:RELEASE_TAG already points to another commit"
            }
          }

      - name: Prepare isolated CUDA SDK and MSVC environment
        shell: pwsh
        run: |
          $cuda = Join-Path $env:RUNNER_TEMP "nnci-cuda"
          python scripts/install_cuda.py --output $cuda
          if ($LASTEXITCODE -ne 0) { throw "CUDA SDK bootstrap failed" }
          "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vs) { throw "MSVC installation not found" }
          $setup = 'call "{0}\VC\Auxiliary\Build\vcvars64.bat" >nul && set' -f $vs
          $variables = @("PATH", "INCLUDE", "LIB", "LIBPATH", "VSINSTALLDIR", "VCINSTALLDIR", "VCToolsInstallDir", "VCToolsVersion", "WindowsSdkDir", "WindowsSDKVersion", "UniversalCRTSdkDir", "UCRTVersion")
          $environment = cmd.exe /d /c $setup
          if ($LASTEXITCODE -ne 0) { throw "MSVC environment setup failed" }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$' -and $variables -contains $Matches[1]) {
              $line >> $env:GITHUB_ENV
            }
          }

      - name: Configure CUDA-enabled Release build
        shell: pwsh
        run: |
          $ninja = Join-Path $env:VSINSTALLDIR "Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MAKE_PROGRAM="$ninja" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DNNCI_ENABLE_CUDA=ON -DCUDAToolkit_ROOT="$env:CUDA_PATH" `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH/bin/nvcc.exe" `
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90"
          if ($LASTEXITCODE -ne 0) { throw "CUDA configuration failed" }

      - name: Build
        run: cmake --build build --config Release

      - name: Test CPU regression suite (hosted runner has no GPU)
        run: |
          ctest --test-dir build -C Release -LE gpu --output-on-failure

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $exe = "build/nnci.exe"
          if (-not (Test-Path $exe)) { throw "Release executable not found: $exe" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Executable help smoke test failed" }

      - name: Package and smoke-test Windows distribution
        shell: pwsh
        run: |
          $packageRoot = "dist/nnci-windows-x64"
          New-Item -ItemType Directory -Force "$packageRoot/scripts" | Out-Null
          Copy-Item "build/nnci.exe" "$packageRoot/nnci.exe"
          Copy-Item "build/scripts/plot_capacity.py" "$packageRoot/scripts/plot_capacity.py"
          Copy-Item "build/scripts/plot_strength.py" "$packageRoot/scripts/plot_strength.py"
          Copy-Item "scripts/install_cuda.py" "$packageRoot/scripts/install_cuda.py"
          Copy-Item "$env:CUDA_PATH/licenses/cuda_cudart/LICENSE" "$packageRoot/CUDA_LICENSE.txt"
          Copy-Item "requirements-plot.txt" "$packageRoot/requirements-plot.txt"
          New-Item -ItemType Directory -Force "$packageRoot/doc" | Out-Null
          Copy-Item -Path "doc/*" -Destination "$packageRoot/doc" -Recurse
          Copy-Item "LICENSE" "$packageRoot/LICENSE"
          Copy-Item "THIRD_PARTY_NOTICES.md" "$packageRoot/THIRD_PARTY_NOTICES.md"
          @'
          # NNCI Course Project — Windows x64

          This ZIP contains the command-line application and plotting scripts.

          Extract the full ZIP and keep `nnci.exe` and `scripts/` together. Plotting needs Python 3 and Matplotlib:

              py -3 -m pip install -r requirements-plot.txt

          Examples:

              nnci.exe --help
              nnci.exe perceptron --validation
              nnci.exe perceptron --capacity --dimensions 20 --p-min 15 --p-max 60 --p-step 5
              nnci.exe perceptron --NCapacity 20 60 20 --parallelize
              nnci.exe perceptron --strength --dimensions 20 --patterns 15

          Optional GPU example: `nnci.exe perceptron --capacity --dimensions 20 --cuda`.
          CPU execution is the default. Pass --cuda to use an NVIDIA GPU with a CUDA-13.4-compatible driver. The CUDA runtime is statically linked; no toolkit installation is required to run this package. Built GPU architectures: 75, 80, 86, 89, 90, with PTX forward compatibility. NVIDIA runtime terms are in CUDA_LICENSE.txt.
          For CPU capacity or NCapacity studies, pass --parallelize to run independent work on a bounded worker pool. It cannot be combined with --cuda.

          ## Docs

          See [doc/README.md](doc/README.md) for the algorithm and build notes.

          Results and logs are written relative to the current working directory. Plotting scripts are found beside nnci.exe.
          '@ | Set-Content "$packageRoot/README.md" -Encoding utf8
          @'
          NNCI Course Project — Windows x64

          Extract the full ZIP and keep scripts/ beside nnci.exe.
          Plotting requires Python 3 and Matplotlib. From this folder, install it with:

              py -3 -m pip install -r requirements-plot.txt

          Quick start:
              nnci.exe --help
              nnci.exe perceptron --validation
              nnci.exe perceptron --NCapacity 20 60 20 --parallelize
              nnci.exe perceptron --strength --dimensions 20 --patterns 15

          Optional GPU execution: append --cuda. CPU remains the default.
          Use --parallelize to run independent CPU capacity/NCapacity tasks concurrently; it cannot be combined with --cuda.
          An NVIDIA GPU and CUDA-13.4-compatible driver are required for --cuda.
          No toolkit is required at runtime. See CUDA_LICENSE.txt for NVIDIA terms.

          Docs: doc/README.md, doc/algorithm.md, doc/development.md
          Results and logs are written relative to the current working directory.
          '@ | Set-Content "$packageRoot/README.txt" -Encoding utf8
          Compress-Archive -Path "$packageRoot/*" -DestinationPath "dist/nnci-windows-x64.zip" -Force

          $check = Join-Path $env:RUNNER_TEMP "nnci-package-check"
          Expand-Archive "dist/nnci-windows-x64.zip" $check -Force
          if (-not (Test-Path "$check/nnci.exe") -or
              -not (Test-Path "$check/scripts/plot_strength.py") -or
              -not (Test-Path "$check/scripts/plot_capacity.py") -or
              -not (Test-Path "$check/requirements-plot.txt") -or
              -not (Test-Path "$check/scripts/install_cuda.py") -or
              -not (Test-Path "$check/CUDA_LICENSE.txt") -or
              -not (Test-Path "$check/README.md") -or
              -not (Test-Path "$check/README.txt") -or
              -not (Test-Path "$check/doc/README.md") -or
              -not (Test-Path "$check/doc/algorithm.md") -or
              -not (Test-Path "$check/doc/development.md") -or
              -not (Test-Path "$check/LICENSE") -or
              -not (Test-Path "$check/THIRD_PARTY_NOTICES.md")) {
            throw "Windows package is missing a required executable, document, script, or dependency file"
          }
          $smoke = Join-Path $env:RUNNER_TEMP "nnci-package-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Push-Location $smoke
          & "$check/nnci.exe" perceptron --validation
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted package validation failed"
          }
          & "$check/nnci.exe" perceptron --strength --dimensions 2 --patterns 2 --datasets 10 --max-epochs 100 --seed 4
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "results/strength_histogram.png")) {
            throw "Extracted package could not plot from an unrelated working directory"
          }
          Pop-Location

      - name: Tag commit and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $existing = @(git tag --list $env:RELEASE_TAG)
          if ($existing.Count -eq 0) {
            git tag -a $env:RELEASE_TAG $env:GITHUB_SHA -m "Release $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not create release tag" }
          }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not push release tag" }

          gh release create $env:RELEASE_TAG "dist/nnci-windows-x64.zip" `
            --verify-tag --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub release" }

          $releaseJson = gh release view $env:RELEASE_TAG --json tagName,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not verify published release" }
          $release = $releaseJson | ConvertFrom-Json
          $assets = @($release.assets)
          if ($release.tagName -ne $env:RELEASE_TAG -or
              $assets.Count -ne 1 -or $assets[0].name -ne "nnci-windows-x64.zip") {
            throw "Expected release $env:RELEASE_TAG to contain only nnci-windows-x64.zip"
          }
